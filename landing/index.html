<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>universe</title>
<meta name="description" content="Haxe source, compiled in your browser by a WebAssembly compiler: run it here, or take it home as a native app for any OS and CPU.">
<meta name="theme-color" content="#04050d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main id="universe" class="view">
	<header class="hero">
		<p class="eyebrow"><span class="dot"></span> hxmc nightly <span id="version"></span></p>
		<h1>universe</h1>
		<p class="tagline">Every world here is <em>Haxe source</em>. Your browser compiles it, runs it, and hands you a <em>native app</em> for any machine.</p>
		<p class="hint" id="hint">Pick a world.</p>
	</header>
	<div id="system" class="system" aria-label="Worlds"></div>
	<button id="core" class="core" type="button" aria-describedby="core-state">
		<span class="core-glow"></span>
		<span class="core-label">hxmc</span>
		<span class="core-state" id="core-state">compiler asleep · tap to wake</span>
	</button>
	<footer class="foot">
		<span id="progress-hud" class="hud"></span>
		<a href="https://github.com/benmerckx/universe">source</a>
		<a href="https://github.com/benmerckx/hxmc">hxmc</a>
	</footer>
</main>

<section id="world" class="view" hidden aria-labelledby="world-title">
	<header class="bar">
		<button id="back" class="icon-btn" type="button" aria-label="Back to the universe">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
		</button>
		<div class="title">
			<h2 id="world-title"></h2>
			<p id="world-summary"></p>
		</div>
		<div class="mode" role="group" aria-label="View">
			<button type="button" data-mode="play" aria-pressed="true">Play</button>
			<button type="button" data-mode="code" aria-pressed="false">Code</button>
		</div>
		<span id="world-pkg" class="chip"></span>
	</header>

	<div class="world-body">
	<div class="stage-wrap">
		<div id="stage" class="stage">
			<div id="screen" class="screen"></div>
			<div id="forge" class="forge" hidden>
				<svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
					<circle class="track" cx="100" cy="100" r="84" />
					<circle id="ring-fetch" class="seg" cx="100" cy="100" r="84" />
					<circle id="ring-parse" class="seg" cx="100" cy="100" r="72" />
					<circle id="ring-emit" class="seg" cx="100" cy="100" r="60" />
					<circle id="ring-link" class="seg" cx="100" cy="100" r="48" />
				</svg>
				<div class="forge-core">
					<strong id="forge-count">0</strong>
					<span id="forge-phase">waking the compiler</span>
				</div>
				<ol class="phases" aria-hidden="true">
					<li data-phase="fetch">fetch</li><li data-phase="parse">parse · type</li><li data-phase="emit">emit</li><li data-phase="link">link</li>
				</ol>
				<div id="ticker" class="ticker" aria-live="polite"></div>
			</div>
			<button id="play" class="play" type="button" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
				<span>Tap to play</span>
			</button>
		</div>
		<div id="console" class="console" role="log" aria-label="Program output"></div>
	</div>

	<aside id="source" class="source" hidden aria-label="Source">
		<div class="source-head">
			<div id="tabs" class="tabs" role="tablist"></div>
			<span id="live" class="live" data-state="idle" aria-live="polite"><i></i><span></span></span>
			<button id="reset" class="text-btn" type="button" hidden title="Put this file back as shipped">Reset</button>
			<button id="source-close" class="icon-btn" type="button" aria-label="Close the code">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
			</button>
		</div>
		<div id="editor" class="editor"></div>
		<div id="info" class="info" aria-live="polite"></div>
		<div id="keybar" class="keybar" aria-label="Keys">
			<button type="button" data-key="tab">⇥</button><button type="button" data-key="ins">{</button><button type="button" data-key="ins">}</button><button type="button" data-key="ins">(</button><button type="button" data-key="ins">)</button><button type="button" data-key="ins">;</button><button type="button" data-key="ins">.</button><button type="button" data-key="ins">=</button><button type="button" data-key="ins">"</button><button type="button" data-key="ins">:</button><button type="button" data-key="complete" aria-label="Complete">⌁</button><button type="button" data-key="left" aria-label="Left">←</button><button type="button" data-key="right" aria-label="Right">→</button><button type="button" data-key="undo" aria-label="Undo">↶</button>
		</div>
	</aside>
	</div>

	<div id="corner" class="corner" role="tablist" aria-label="Corner">
		<button type="button" role="tab" data-corner="preview" aria-selected="true" aria-label="The program">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
		</button>
		<button type="button" role="tab" data-corner="map" aria-selected="false" aria-label="The code's map">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 10h16M4 14h8M4 18h13" /></svg>
		</button>
	</div>
	<canvas id="minimap" class="minimap" aria-label="The code's map: tap to go there"></canvas>

	<nav class="dock" aria-label="Actions">
		<button id="run" class="btn" type="button">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" /></svg>
			<span>Restart</span>
		</button>
		<button id="show-source" class="btn" type="button" aria-expanded="false" aria-controls="source">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5" /></svg>
			<span>Code</span>
		</button>
		<div class="split">
			<button id="download" class="btn primary" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-5-5m5 5l5-5M5 20h14" /></svg>
				<span><span class="dl-main">Download native</span><span id="dl-target" class="dl-sub"></span></span>
			</button>
			<button id="pick" class="btn primary caret" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose the OS and CPU">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
			</button>
			<ul id="targets" class="targets" role="listbox" hidden aria-label="Targets"></ul>
		</div>
	</nav>
</section>

<div id="sheet" class="sheet" hidden role="dialog" aria-labelledby="sheet-title">
	<div class="sheet-card">
		<h3 id="sheet-title"></h3>
		<div id="sheet-body"></div>
		<button id="sheet-ok" class="btn primary" type="button">Got it</button>
	</div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p class="noscript">This universe runs on JavaScript and WebAssembly.</p></noscript>
</body>
</html>
