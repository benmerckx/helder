# The checks (tests/Run.hx: bun run test <lane>), with @hxmc/cli's compiler
# installed by bun (package.json's devDependencies; node runs the compiler's
# launcher and the test scripts).
# - headless: the lanes that need no GPU, display or browser (bun run test);
# - gfx: the native GPU and audio lanes on Mesa's llvmpipe and Xvfb;
# - browser: WebGPU, WebGL2, WebAudio and the DOM in headless Chromium.
# gfx and browser are not required (continue-on-error) while the stack is
# unstable.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fonts (DejaVu Sans, for text and ui)
        run: sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core
      - name: Headless checks
        run: bun run test -k headless

  gfx:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth libasound2t64 fonts-dejavu-core fonts-inter libgtk-3-0t64 dbus at-spi2-core fonts-noto-color-emoji
      - name: gfx, 3d, audio, touch, ui (Mesa llvmpipe, Xvfb)
        run: bun run test -k gfx 3d audio touch ui-draw
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: images, path: "bin/gfx/**/*.png\nbin/3d/**/*.png\nbin/ui/**/*.png", retention-days: 7, if-no-files-found: ignore}

  browser:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Playwright
        run: |
          set -ex
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium > /dev/null
      - name: gfx, 3d, audio, web and ui in Chromium
        run: bun run test -k gfx-web 3d-web audio-web web ui-web
