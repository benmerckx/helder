# The checks (tests/Run.hx: bun run test <lane>), with @hxmc/cli's compiler
# installed by bun (package.json's devDependencies; node runs the compiler's
# launcher and the test scripts).
# - headless: the lanes that need no GPU, display or browser (bun run test),
#   then helder.image's decoders fuzzed for 30 s (image-fuzz);
# - gfx: the native GPU and audio lanes on Mesa's llvmpipe and Xvfb;
# - browser: WebGPU, WebGL2, WebAudio and the DOM in headless Chromium;
# - android: tests/pack/Hello.hx on an emulator (helder run, adb), the
#   screen fixture (tests/pack/Screen.hx: its window, safe area and the
#   display's frames, a rotation, the background), helder dev's loop there
#   (tests/os/dev/dev-android.mjs), the cube's window and touches
#   (tests/gfx/android.sh), a drawn ui's touch fling (tests/os/android-touch.sh),
#   native.jni from TypeScript (tests/typescript/native/android.sh);
# - ios-simulator: tests/pack/Hello.hx on an iPhone simulator of a macOS
#   runner (helder run, simctl), the screen fixture, codesign --verify and
#   plutil; the cube's window and touches (tests/gfx/ios.sh: SimTap's clicks).
# - ios-signing: an iPhone's app signed for distribution by helder with a
#   throwaway identity, checked by codesign and assetutil on a macOS runner.
# - desktop-macos, desktop-windows: the window lane (and helder's viewer,
#   apps/viewer), and helder/native from TypeScript (typescript-native:
#   Objective-C, COM) on a macOS and a Windows runner;
# - the viewer's releases are release.yml's (a tag viewer-v<version>);
# - publish-npm: on pushes to main once headless passes, the package as a
#   nightly (<version>-nightly.<date>.<commit>, npm's tag nightly), as
#   hxmc publishes @hxmc/cli's (NPM_TOKEN, with provenance).
# gfx, browser, android, ios-simulator, ios-signing and the desktops are not required
# (continue-on-error) while the stack is unstable (android and
# ios-simulator were written without an emulator, a simulator or a Mac:
# CI is where they run).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fonts (DejaVu Sans, for text and ui), libEGL and Mesa's llvmpipe
        # (helder test's host build links helder.gfx's libEGL.so.1 when a test
        # reaches the scene; nothing opens a display. llvmpipe: the pack
        # lane's store screenshots, rendered offscreen: STORE_SHOTS_REQUIRE)
        run: sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core fonts-liberation libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Headless checks
        # (pack: the Android and iOS runtime objects fetched, their builds
        # skipped without them: the android job requires them; the SDK's
        # build tools on the PATH: zipalign, aapt, apksigner)
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          STORE_SHOTS_REQUIRE=1 bun run test -k headless
      - name: helder.image's decoders fuzzed for 30 s (tests/image/Fuzz.hx)
        run: bun run test image-fuzz
      - name: helder.pdf fuzzed for 30 s (tests/pdf/Fuzz.hx)
        run: bun run test pdf-fuzz

  gfx:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth libasound2t64 fonts-dejavu-core fonts-inter libgtk-3-0t64 dbus at-spi2-core fonts-noto-color-emoji fonts-freefont-ttf libharfbuzz0b libfreetype6 fontconfig libtiff6 libheif1 libheif-plugin-aomdec libraw23t64 osslsigncode desktop-file-utils appstream libenchant-2-2 hunspell-en-us
      # (a headless weston for the wayland lane, the protocols' XML; without them the lane only builds)
      - name: Wayland's packages
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get install -qqy --no-install-recommends weston wayland-protocols libwayland-dev libwayland-egl1 libxkbcommon0
      - name: gfx, 3d, audio, ui, helder run --headless, helder.syntax's edits run headless, window, the viewer's (Mesa llvmpipe, Xvfb; its release packages), Wayland (a headless weston), the platform's text
        run: bun run test -k gfx 3d audio ui-draw headless-run syntax-run window viewer-window viewer-package wayland dbus system-text system-images canvas-gpu
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: images, path: "bin/gfx/**/*.png\nbin/headless-run/**/*.png\nbin/canvas/*.png\nbin/3d/**/*.png\nbin/ui/**/*.png\nbin/text/*.png\nbin/os/*.png", retention-days: 7, if-no-files-found: ignore}

  browser:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Playwright
        run: |
          set -ex
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core poppler-utils
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium > /dev/null
      - name: gfx, 3d, audio, web and ui in Chromium
        run: bun run test -k gfx-web 3d-web audio-web web ui-web canvas-web canvas-doc

  # Android on an x86-64 emulator with KVM (reactivecircus/android-emulator-runner,
  # API 34, as hxmc's CI): tests/pack/android.sh (helder run --target
  # android: built for the emulator's ABI, installed, started, the hello line
  # from logcat; then the APK by adb alone; then tests/pack/Screen.hx,
  # checked by tests/pack/screen.mjs) and tests/os/dev/dev-android.mjs
  # (helder dev --target android: the APK installed once, two edits swapped
  # into the same process, the state kept). A Pixel 6's profile: a
  # navigation bar and a camera's cutout, for the insets.
  android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: The CLI, Android's runtime objects, the APKs and the App Bundle checked (pack; bundletool validate and build-apks)
        env:
          PACK_REQUIRE: 1
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          export BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          bun run test pack
      - name: The device tests' apps (tests/gfx/android, the cube and its touches; tests/os/AndroidTouchTest.hx, a drawn ui's fling)
        env:
          HXMC_RT_DIR: ${{ github.workspace }}/bin/pack/rt
          HELDER_CACHE: ${{ github.workspace }}/bin/pack/cache
        run: |
          bin/cli/helder build tests/gfx/android --target android-x86_64 -o bin/pack/AndroidTest.apk
          bin/cli/helder build tests/os/AndroidTouchTest.hx --target android-x86_64 -o bin/pack/AndroidTouchTest.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Hello and helder dev on an emulator (x86-64, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HXMC_RT_DIR: ${{ github.workspace }}/bin/pack/rt
          HELDER_CACHE: ${{ github.workspace }}/bin/pack/cache
        with:
          api-level: 34
          arch: x86_64
          target: default
          # (a phone's screen: a navigation bar, its density; the generic
          # device has hardware keys and no bar, so no inset)
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            sh tests/pack/android.sh bin/cli/helder bin/pack/android
            node tests/os/dev/dev-android.mjs bin/cli/helder bin/pack/dev-emulator
            sh tests/gfx/android.sh bin/pack/AndroidTest.apk bin/pack/android-gfx
            sh tests/os/android-touch.sh bin/pack/AndroidTouchTest.apk bin/pack/android-gfx
            sh tests/typescript/native/android.sh bin/cli/helder bin/pack/android-ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android
          path: |
            bin/pack/android/*.txt
            bin/pack/android/*.png
            bin/pack/android-gfx/*.txt
            bin/pack/android-gfx/*.png
            bin/pack/android-ts/*.txt
            bin/pack/*.apk
          retention-days: 7
          if-no-files-found: ignore

  # iOS on an iPhone simulator of a macOS runner (Apple silicon: hxmc's
  # ios-sim-arm64), as hxmc's CI: the pack lane (its bundles checked with
  # codesign --verify and plutil too, the dev loop against a stand-in
  # simctl) and tests/pack/ios.sh (a simulator of the newest runtime made,
  # helder run --target ios -d <it>: booted, installed, launched, the hello
  # line from simctl launch --console; then tests/pack/Screen.hx in the
  # background of the script, checked by tests/pack/screen.mjs).
  ios-simulator:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: The CLI, the bundles checked (pack)
        run: bun run test pack
      - name: Hello on a simulator
        run: sh tests/pack/ios.sh bin/cli/helder bin/pack/ios
      - name: The cube and its touches on a simulator (tests/gfx/ios.sh, SimTap's clicks)
        # (also when Hello's step failed: their checks are their own)
        if: ${{ !cancelled() }}
        run: |
          bin/cli/helder build tests/gfx/ios --target ios-sim -o bin/pack/IosTest.app
          bin/cli/helder build tests/gfx/SimTap.hx -o bin/pack/SimTap
          sh tests/gfx/ios.sh bin/pack/IosTest.app bin/pack/ios-gfx "$PWD/bin/pack/SimTap"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios
          path: |
            bin/pack/ios/*.txt
            bin/pack/ios/*.png
            bin/pack/ios-gfx/*.txt
            bin/pack/ios-gfx/*.png
          retention-days: 7
          if-no-files-found: ignore

  # An iPhone's app signed for distribution without Apple's tools
  # (helder.pack.apple.CodeSign, tests/pack/signing's throwaway CA and
  # profile), then checked by them on a macOS runner: codesign --verify
  # --deep --strict, its entitlements and requirement, assetutil --info on
  # the icon's Assets.car (tests/pack/signing/verify.sh). App Store
  # Connect's acceptance is a TestFlight upload with the owner's account
  # (src/helder/pack/README.md).
  ios-signing:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Signed by helder, checked by codesign and assetutil
        run: sh tests/pack/signing/verify.sh

  # The desktops beside Linux's: macOS (Apple silicon) and Windows, their
  # windows (the window lane: a drop through each system's own mechanism,
  # moveTo and position, fullscreen) on the runner's own session.
  desktop-macos:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: macOS x86-64's runtime objects (the universal bundle's second slice)
        run: |
          v=$(node -p "require('./node_modules/@hxmc/cli/package.json').version")
          mkdir -p "$RUNNER_TEMP/rt" && (cd "$RUNNER_TEMP/rt" && npm pack "@hxmc/darwin-x64@$v" > /dev/null && tar xzf hxmc-darwin-x64-*.tgz)
          # (HXMC_RT_DIR is where helder's compiler looks then: arm64's objects there too)
          cp -R node_modules/@hxmc/darwin-arm64/macos-arm64 "$RUNNER_TEMP/rt/package/"
          echo "HXMC_RT_DIR=$RUNNER_TEMP/rt/package" >> "$GITHUB_ENV"
      - name: window, the viewer (its tests, its builds, a real window, its app bundle, its release packages), helder/native from TypeScript (Core Foundation, Objective-C)
        run: bun run test -k window viewer viewer-window viewer-app viewer-package system-images system-text typescript-native
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: text-macos, path: "bin/text/*.png", retention-days: 7, if-no-files-found: ignore}

  desktop-windows:
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # (bun's shims are .exe, not haxe.cmd)
      HAXE: haxe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: window, the viewer (its tests, its builds, a real window), the system's decoders, helder/native from TypeScript (COM)
        run: bun run test -k window viewer viewer-window system-images system-text typescript-native
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: text-windows, path: "bin/text/*.png", retention-days: 7, if-no-files-found: ignore}

  publish-npm:
    needs: headless
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The nightly's version
        run: |
          v=$(node -p "require('./package.json').version")-nightly.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)
          npm version --no-git-tag-version "$v"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::no NPM_TOKEN secret: the nightly is not published"; exit 0; fi
          npm publish --access public --provenance --tag nightly
