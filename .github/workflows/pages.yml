# The examples' page (site/, bun run site) on GitHub Pages: on pushes to
# main, bin/site built (each example that runs in a browser built for the
# web, the page's TSX built and run), checked in headless Chromium (bun run
# site:check: every card, two demos played), then deployed as the Pages
# artifact (the repository's Pages source: GitHub Actions).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fonts (DejaVu Sans, for the ui and text examples)
        run: sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core
      - name: Build
        run: bun run site
      - name: Check (the page in Chromium)
        # (not required: the page is deployed without it)
        continue-on-error: true
        run: |
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium > /dev/null
          bun run site:check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/site
      - id: deploy
        uses: actions/deploy-pages@v5
