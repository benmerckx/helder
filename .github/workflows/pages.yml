# The examples' page (site/, bun run site) on GitHub Pages: on pushes to
# main, bin/site built (each example that runs in a browser built for the
# web, an `apk: android` example's APK, the page's TSX built and run), the showreel
# and the demos' clips recorded headless into bin/site/media (bun run
# site:reel: helder run --headless's frames streamed to ffmpeg; the videos
# are not in git), checked in headless Chromium (bun run
# site:check: every card, every demo played), the demos' numbers measured
# (bun run site:numbers), then deployed as the Pages
# artifact (the repository's Pages source: GitHub Actions).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fonts (DejaVu Sans, for the ui and text examples)
        run: sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core
      - name: Build
        # (SITE_APK: the examples marked `// apk: android` built for Android
        # phones too, their APKs in bin/site/apk/ linked from their cards;
        # signed with the repository secret HELDER_ANDROID_KEY, a helder
        # debug key's text (HELDER_ANDROID_KEY takes it as it is), so that
        # each new APK installs over the last; without it a fresh key each run)
        env:
          SITE_APK: 1
          HELDER_ANDROID_KEY: ${{ secrets.HELDER_ANDROID_KEY }}
        run: bun run site
      # (the videos kept in the actions cache by what they show: the demos'
      # sources and the recorder; recorded again, some 15 minutes, only when
      # those change, so that other pushes deploy as fast as before)
      - id: reel
        uses: actions/cache/restore@v4
        with:
          path: bin/reel-out/media
          key: reel-${{ hashFiles('examples/showreel/**', 'examples/fx/**', 'examples/literal/**', 'examples/notes/**', 'site/reel.mjs') }}
      - id: videos
        name: "Videos (the showreel and the demos' clips: headless, frame-exact, into bin/site/media)"
        # (not required: the page shows a note where a video is missing)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ "${{ steps.reel.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -qqy --no-install-recommends ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri
            bun run site:reel bin/reel-out
          fi
          mkdir -p bin/site/media
          cp bin/reel-out/media/* bin/site/media/
      - if: steps.reel.outputs.cache-hit != 'true' && steps.videos.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: bin/reel-out/media
          key: ${{ steps.reel.outputs.cache-primary-key }}
      - name: Check (the page in Chromium)
        # (not required: the page is deployed without it)
        continue-on-error: true
        run: |
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium > /dev/null
          bun run site:check
      - name: "Numbers (the demos' pages, headless, software rendering)"
        # (bin/site/numbers.json, which the demos' pages read; without it
        # their CI cells read "–")
        continue-on-error: true
        run: bun run site:numbers
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/site
      - id: deploy
        uses: actions/deploy-pages@v5
