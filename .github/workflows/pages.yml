# The landing page (landing/, make landing) on GitHub Pages, deployed from a
# branch: on pushes to main, bin/landing built (hxmc from source at
# HXMC_REV, cached as ci.yml caches it: the tool runs the build and builds
# the page's resident compiler), checked (make landing-check: the page's
# builds in node), then committed alone to gh-pages (replacing what was
# there: one commit, no history). Pages serves gh-pages, its root.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fonts (DejaVu Sans, for the ui and text examples)
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - id: rev
        run: echo "rev=$(sed -n 's/^HXMC_REV ?= //p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Cache the hxmc checkout and its build
        uses: actions/cache@v6
        with:
          path: hxmc
          key: hxmc-${{ steps.rev.outputs.rev }}-v1
      - name: hxmc (tool, std) from source
        run: make hxmc
      - name: Build
        run: make landing
      - name: Check (the page's builds, in node)
        run: make landing-check
      - name: Deploy to gh-pages
        working-directory: bin/landing
        run: |
          rm -f check.js
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "landing: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
