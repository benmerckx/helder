# The landing page (landing/, make landing) on GitHub Pages: on pushes to main, bin/landing built (hxmc from source at
# HXMC_REV, cached as ci.yml caches it: the tool runs the build and builds
# the page's resident compiler), checked (make landing-check: the page's
# builds in node), then deployed as the Pages artifact (the repository's
# Pages source: GitHub Actions).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fonts (DejaVu Sans, for the ui and text examples)
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - id: rev
        run: echo "rev=$(sed -n 's/^HXMC_REV ?= //p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Cache the hxmc checkout and its build
        uses: actions/cache@v6
        with:
          path: hxmc
          key: hxmc-${{ steps.rev.outputs.rev }}-v1
      - name: hxmc (tool, std) from source
        run: make hxmc
      - name: Build
        run: make landing
      - name: Check (the page's builds, in node)
        run: make landing-check
      - name: Without the check
        run: rm -f bin/landing/check.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/landing
      - id: deploy
        uses: actions/deploy-pages@v5
